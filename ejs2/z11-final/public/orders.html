<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Заказы</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <a href="/" class="btn btn-secondary" style="position: absolute; top: 120px; left: 50px;">← Назад</a>

  <h1 style="text-align: center;">Управление заказами</h1>

  <div class="toolbar">
    <select id="filterFilial" class="input"><option value="">Все склады</option></select>
    <select id="filterSuplier" class="input"><option value="">Все поставщики</option></select>
    <button id="btnNewOrder" class="btn">Создать заказ</button>
  </div>

  <div class="table-wrapper">
    <table class="products-table">
      <thead>
        <tr>
          <th>№</th>
          <th>Дата</th>
          <th>Склад</th>
          <th>Поставщик</th>
          <th>Сумма</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody id="ordersContainer">
        <tr><td colspan="6">Загрузка...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- МОДАЛ: Создание/Просмотр заказа -->
  <div id="modalOrder" class="modal">
    <div class="modal-content" style="width: 600px;">
      <h2 id="modalOrderTitle">Создать заказ</h2>
      
      <div id="orderReadOnlyInfo" style="display:none; margin-bottom: 15px; color: #4CAF50;">
        <b>Информация:</b> <span id="lblOrderDetails"></span>
      </div>

      <form id="formOrder">
        <div style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label>Склад:</label>
            <select id="formFilial" class="input" required></select>
          </div>
          <div style="flex: 1;">
            <label>Поставщик:</label>
            <select id="formSuplier" class="input" required></select>
          </div>
        </div>

        <label style="margin-top: 15px; display: block;">Товары поставщика:</label>
        <table class="products-table" style="font-size: 14px;">
          <thead>
            <tr>
              <th>Название</th>
              <th>Цена</th>
              <th>Кол-во</th>
              <th>Сумма</th>
            </tr>
          </thead>
          <tbody id="orderItemsContainer">
            <tr><td colspan="4">Выберите поставщика</td></tr>
          </tbody>
        </table>

        <div style="text-align: right; margin-top: 15px; font-size: 18px;">
          Итого: <b id="lblTotalPrice" style="color: #4CAF50;">0 ₽</b>
        </div>
        
        <div class="modal-actions">
          <button type="submit" id="btnSubmitOrder" class="btn">Подтвердить</button>
          <button type="button" class="btn btn-danger" onclick="closeModal('modalOrder')">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/orders.js"></script>
      <!-- футера -->
  <script src="/footer.js"></script>
</body>
</html>
